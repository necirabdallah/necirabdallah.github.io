<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Outline Filter</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        canvas { border: 1px solid #ccc; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Remove Colors, Keep Outlines</h1>
    <input type="file" id="imageInput" accept="image/*">
    <div>
        <canvas id="inputCanvas"></canvas>
    </div>
    <div>
        <canvas id="outputCanvas"></canvas>
    </div>
    <script>
        const input = document.getElementById('imageInput');
        const inputCanvas = document.getElementById('inputCanvas');
        const outputCanvas = document.getElementById('outputCanvas');
        const inCtx = inputCanvas.getContext('2d');
        const outCtx = outputCanvas.getContext('2d');

        input.addEventListener('change', function(evt) {
            const file = evt.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    inputCanvas.width = img.width;
                    inputCanvas.height = img.height;
                    outputCanvas.width = img.width;
                    outputCanvas.height = img.height;
                    inCtx.drawImage(img, 0, 0);
                    const imageData = inCtx.getImageData(0, 0, img.width, img.height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                        if (gray < 128) {
                            data[i] = data[i + 1] = data[i + 2] = 0; // black
                        } else {
                            data[i] = data[i + 1] = data[i + 2] = 255; // white
                        }
                    }
                    outCtx.putImageData(imageData, 0, 0);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
